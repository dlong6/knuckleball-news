<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Knuckleball News</title>
    <script>
      // Articles published since the last daily build don't have a pre-built page yet.
      // Send readers to the live version of the article instead.
      (function () {
        var match = window.location.pathname.match(/^\/articles\/([^\/]+)\/?$/);
        if (match) {
          window.location.replace("/article.html?slug=" + match[1]);
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell page-content">
      <section class="main-feed">
        <article class="post-card">
          <p class="post-kicker">Not Found</p>
          <h2>Page Not Found</h2>
          <p>The page you requested could not be found.</p>
          <p><a href="/">Return to home</a></p>
        </article>
      </section>
    </main>
  </body>
</html>
