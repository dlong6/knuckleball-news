<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Every ticker headline that has run across the top of Knuckleball News." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chirps | Knuckleball News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Merriweather:wght@400;700;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="utility-bar">
        <div class="page-shell utility-inner">
          <a class="utility-logo" href="index.html" aria-label="Knuckleball News Home">
            <img src="logo_blue.png" alt="Knuckleball News" />
          </a>
          <div class="headline-item">
            <div class="headline-marquee" aria-label="Latest chirp">
              <div class="headline-track">
                <span class="headline-copy"></span>
                <span class="headline-copy" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="masthead page-shell">
        <a class="brand" href="index.html" aria-label="Knuckleball News Home">
          <img src="logo_white-removebg-preview.png" alt="Knuckleball News" />
        </a>
      </div>

      <nav class="primary-nav">
        <div class="page-shell nav-inner">
          <a href="index.html">Home</a>
          <a href="chirps.html">Chirps</a>
          <a href="#" data-open-team-modal="true">Search</a>
          <a href="mailto:golongathletics@gmail.com">Contact</a>
          <a class="nav-mini-logo" href="admin.html" aria-label="Knuckleball News Admin Login">
            <img src="logo_blue.png" alt="Knuckleball News" />
          </a>
        </div>
      </nav>
    </header>

    <main class="page-shell page-content headline-archive-page">
      <section class="main-feed" aria-label="Chirps">
        <article class="post-card headline-archive-card">
          <h2>Chirps Archive</h2>
          <p class="headline-archive-intro">Every ticker headline that has run across the top of the site.</p>
          <label class="headline-archive-search">
            <span class="visually-hidden">Search chirps</span>
            <input id="headline-archive-search" type="search" placeholder="Search chirps" autocomplete="off" />
          </label>
          <p id="headline-archive-status" class="headline-archive-status">Loading chirps...</p>
          <ol id="headline-archive-list" class="headline-archive-list"></ol>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <div class="page-shell footer-inner">
        <div>
          <h4>Navigation</h4>
          <a href="index.html">Home</a>
          <a href="/articles/">All Articles</a>
          <a href="chirps.html">Chirps</a>
          <a href="admin.html">Login</a>
          <a href="mailto:golongathletics@gmail.com">Contact</a>
        </div>
      </div>
      <div class="footer-brand-wrap page-shell">
        <img class="footer-brand" src="logo_white-removebg-preview.png" alt="Knuckleball News" />
      </div>
      <p class="disclaimer">Knuckleball News is an independent baseball news site and is not affiliated with Major League Baseball.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="kb-config.js"></script>
    <script src="kb-data.js"></script>
    <script src="ticker.js"></script>
    <script src="teams-nav.js"></script>
    <script src="headlines.js"></script>
  </body>
</html>
