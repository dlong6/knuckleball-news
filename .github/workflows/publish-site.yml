# Publishes knuckleballnews.com to GitHub Pages.
# Runs when files are pushed to main, once a day, and on demand
# (Actions tab > "Publish site" > "Run workflow").
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *" # once a day at 12:00 UTC (5 AM Pacific)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build article pages and sitemap
        run: node scripts/build-seo.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
