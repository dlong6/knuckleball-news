<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knuckleball News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Merriweather:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9A%BE%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="utility-bar">
        <div class="page-shell utility-inner">
          <a class="utility-logo" href="index.html" aria-label="Knuckleball News Home">
            <img src="logo_blue.png" alt="Knuckleball News" />
          </a>
          <div class="headline-item">
            <div class="headline-marquee" aria-label="Today's headline">
              <div class="headline-track">
                <span class="headline-copy"></span>
                <span class="headline-copy" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="masthead page-shell">
        <a class="brand" href="index.html" aria-label="Knuckleball News Home">
          <img src="logo_white-removebg-preview.png" alt="Knuckleball News" />
        </a>
      </div>

      <nav class="primary-nav">
        <div class="page-shell nav-inner">
          <a href="index.html">Home</a>
          <a href="#" data-open-team-modal="true">Search</a>
          <a href="mailto:golongathletics@gmail.com">Contact</a>
          <a class="nav-mini-logo" href="admin.html" aria-label="Knuckleball News Admin Login">
            <img src="logo_blue.png" alt="Knuckleball News" />
          </a>
        </div>
      </nav>
    </header>

    <main class="page-shell page-content">
      <section class="main-feed" aria-label="Latest posts">
        <article class="post-card">
          <p class="post-kicker">Loading</p>
          <h2>Loading latest articles...</h2>
        </article>
      </section>

      <aside class="sidebar" aria-label="Sidebar modules">
        <section class="module">
          <h3>Article Links</h3>
          <ul id="article-links-list"></ul>
        </section>
        <section class="module home-ad-module" aria-label="Partner advertisement">
          <div class="partner-ad-layout">
            <img class="partner-ad-logo" src="GLA_logo copy.png" alt="GoLong Athletics" />
            <div class="partner-ad-copy">
              <p class="partner-ad-line">QB and Pitcher Training</p>
              <p class="partner-ad-line">
                <a href="https://golongathletics.com" target="_blank" rel="noopener noreferrer">golongathletics.com</a>
              </p>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <footer class="site-footer">
      <div class="page-shell footer-inner">
        <div>
          <h4>Navigation</h4>
          <a href="index.html">Home</a>
          <a href="admin.html">Login</a>
          <a href="mailto:golongathletics@gmail.com">Contact</a>
        </div>
      </div>
      <div class="footer-brand-wrap page-shell">
        <img class="footer-brand" src="logo_white-removebg-preview.png" alt="Knuckleball News" />
      </div>
      <p class="disclaimer">Knuckleball News is an independent baseball news site and is not affiliated with Major League Baseball.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="kb-config.js"></script>
    <script src="kb-data.js"></script>
    <script src="ticker.js"></script>
    <script src="teams-nav.js"></script>
    <script src="site.js"></script>
  </body>
</html>
